<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Event Horizon | Interactive Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <header class="hero-header">
        <h1>🎉 EVENT HORIZON</h1>
        <p>Curate • Explore • Experience — smart event management</p>
    </header>

    <div class="main-content">
        <!-- search bar -->
        <div class="search-section">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Filter by event name or date (YYYY-MM-DD) ...">
            <button class="search-clear" id="clearSearchBtn">✖ Clear</button>
        </div>

        <div class="dashboard">
            <!-- events display area -->
            <div class="events-section">
                <div class="events-header">
                    <h2>📅 Upcoming & Past Events</h2>
                    <span class="event-count" id="eventCountDisplay">0 events</span>
                </div>
                <div id="eventsContainer" class="event-grid">
                    <!-- dynamic events injected here -->
                </div>
            </div>

            <!-- add event form -->
            <div class="form-section">
                <h3 style="margin-bottom: 1rem; color:#124256;">➕ Create New Event</h3>
                <form id="eventForm">
                    <div class="form-group">
                        <label>🎈 Event Name *</label>
                        <input type="text" id="eventName" placeholder="e.g., Tech Summit 2026" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>📅 Event Date *</label>
                        <input type="date" id="eventDate">
                    </div>
                    <div class="form-group">
                        <label>📝 Description *</label>
                        <textarea id="eventDesc" placeholder="Describe the event ..."></textarea>
                    </div>
                    <button type="submit" class="btn-add">+ Add Event</button>
                    <div id="formWarning" class="warning-msg">⚠️ All fields are required!</div>
                </form>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        © <span id="currentYear"></span> Muhammad Abdullah | Event Horizon — Interactive Management System
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
